# Swarmbot application (API + UI in one container) — pinned to one node
# (CHANGE-ME-node-hostname below; see deploy/k3s/README.md), image pulled
# from GHCR. In kubernetes mode the API reads cluster resources
# (nodes/workloads/pods/PVCs/ConfigMaps/Secrets) for the dashboard and applies
# manifests for the "deploy stack" mutation — hence the ServiceAccount + RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: swarmbot
    namespace: swarmbot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: swarmbot
rules:
    - apiGroups: [""]
      resources:
          - nodes
          - namespaces
          - pods
          - pods/log
          - services
          - persistentvolumeclaims
          - configmaps
          - secrets
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      verbs: ["get", "list", "watch"]
    # "Deploy stack" (manifest apply). Tighten if the feature is not needed.
    - apiGroups: [""]
      resources: ["namespaces", "services", "configmaps", "secrets", "persistentvolumeclaims"]
      verbs: ["create", "patch", "update"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets"]
      verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: swarmbot
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: swarmbot
subjects:
    - kind: ServiceAccount
      name: swarmbot
      namespace: swarmbot
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: swarmbot
    namespace: swarmbot
    labels:
        app: swarmbot
spec:
    replicas: 1
    selector:
        matchLabels:
            app: swarmbot
    template:
        metadata:
            labels:
                app: swarmbot
        spec:
            serviceAccountName: swarmbot
            nodeSelector:
                kubernetes.io/hostname: CHANGE-ME-node-hostname
            imagePullSecrets:
                # Required while the GHCR package is private; see README.md.
                - name: ghcr-pull
            containers:
                - name: swarmbot
                  image: ghcr.io/swarmbot-it/swarmbot:latest
                  imagePullPolicy: Always
                  env:
                      # In-cluster ServiceAccount is auto-detected → kubernetes
                      # mode; keep it explicit for clarity.
                      - name: SWARMBOT_ORCHESTRATOR
                        value: kubernetes
                      - name: SWARMBOT_PORT
                        value: "8080"
                      - name: SWARMBOT_DB
                        valueFrom:
                            secretKeyRef:
                                name: postgres-credentials
                                key: SWARMBOT_DB
                      - name: SWARMBOT_INFLUXDB
                        value: http://influxdb:8086
                      - name: SWARMBOT_INFLUXDB_TOKEN
                        valueFrom:
                            secretKeyRef:
                                name: influxdb-credentials
                                key: SWARMBOT_INFLUXDB_TOKEN
                      # --- OIDC login for the internal console (see docs/DEPLOYMENT.md) ---
                      - name: SWARMBOT_OIDC_ISSUER
                        value: https://idp.example
                      - name: SWARMBOT_OIDC_CLIENT_ID
                        value: swarmbot
                      - name: SWARMBOT_OIDC_REDIRECT_URI
                        value: https://swarmbot.example/api/auth/oidc/callback
                      - name: SWARMBOT_OIDC_CLIENT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: swarmbot-oidc
                                key: client_secret
                      # Groups your IdP puts in the ID token's "groups" claim -> role.
                      # Below, anyone in "/admin" gets full admin; everyone else who
                      # logs in is read-only (role "user" — no editor tier configured).
                      - name: SWARMBOT_OIDC_ADMIN_GROUPS
                        value: "/admin"
                      - name: SWARMBOT_OIDC_EDITOR_GROUPS
                        value: ""
                      # Optional: display name for the "Sign in with ___" button
                      # (defaults to the generic "SSO" if unset).
                      # - name: SWARMBOT_OIDC_PROVIDER_LABEL
                      #   value: "Acme SSO"
                      # "/" on this host redirects straight to the IdP (skip the public
                      # landing); the SPA login page also auto-redirects there (escape
                      # hatch: /app/login?password).
                      - name: SWARMBOT_CONSOLE_HOSTS
                        value: swarmbot.example
                      # CORS: the console's own origin(s), plus the public landing's
                      # origin if you also deploy 60-swarmbot-it.yaml. Required —
                      # without it the browser SPA's module/font/GraphQL requests are
                      # rejected (500).
                      - name: SWARMBOT_ALLOWED_ORIGINS
                        value: "https://swarmbot.example"
                      # Uncomment once the agent supports the shared secret
                      # (swarmagent PR "agent-shared-secret-auth"); the agent
                      # must send the same value in the x-agent-token header.
                      # - name: SWARMAGENT_SHARED_SECRET
                      #   valueFrom:
                      #       secretKeyRef:
                      #           name: swarmbot-agent
                      #           key: SWARMAGENT_SHARED_SECRET
                  envFrom:
                      - secretRef:
                            name: swarmbot-bootstrap
                  ports:
                      - containerPort: 8080
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 30
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    name: swarmbot
    namespace: swarmbot
spec:
    type: ClusterIP
    selector:
        app: swarmbot
    ports:
        - port: 8080
          targetPort: 8080
