# OPTIONAL — only relevant if you already sync secrets from a store like
# Vault via External Secrets Operator. If you don't, skip this file and put
# the OIDC client secret straight into 05-secrets.yaml (or your own secret
# manager) as the `swarmbot-oidc` Secret with a `client_secret` key.
#
# Example: an OIDC client secret synced from a Vault-backed ClusterSecretStore
# your ESO installation already defines. Apply-time prerequisites (adjust to
# your own setup):
#   1. Your IdP's client for swarmbot exists and has a client secret.
#   2. That secret is stored in Vault (or your secret store) at the path below.
#   3. The read policy for this ClusterSecretStore permits reading that path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: swarmbot-oidc
    namespace: swarmbot
    labels:
        app.kubernetes.io/name: swarmbot
        app.kubernetes.io/component: oidc
spec:
    refreshInterval: 1h
    secretStoreRef:
        name: CHANGE-ME-cluster-secret-store
        kind: ClusterSecretStore
    target:
        name: swarmbot-oidc
        creationPolicy: Owner
    data:
        - secretKey: client_secret
          remoteRef:
              key: CHANGE-ME/oidc/swarmbot
              property: client_secret
