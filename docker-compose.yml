services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - SWARMBOT_DB=postgres://${POSTGRES_USER:?POSTGRES_USER must be set for production deploys}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production deploys}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set for production deploys}
            - SWARMBOT_INFLUXDB=http://influxdb:8086
            - SWARMBOT_INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set for production deploys}
            - SWARMBOT_PORT=8080
            - SWARMBOT_WORK_DIR=/tmp
            # CORS allowlist. The SPA fetches its own module scripts and fonts with an
            # Origin header, so the console's own URL MUST be listed or every bundle
            # comes back 500 ("Not allowed by CORS") and the UI renders blank. Required
            # rather than defaulted: the correct value is deployment topology, not a
            # constant. For this compose file as published, that is
            # "http://localhost:888,http://127.0.0.1:888".
            - SWARMBOT_ALLOWED_ORIGINS=${SWARMBOT_ALLOWED_ORIGINS:?SWARMBOT_ALLOWED_ORIGINS must be set - the console's own origin(s), e.g. http://localhost:888 for this compose file}
            # First-run admin, created only while the users table is empty. Without it
            # the stack starts with no users and nothing can log in. The username is a
            # plain identifier so it defaults; the password never does.
            - SWARMBOT_BOOTSTRAP_ADMIN=${SWARMBOT_BOOTSTRAP_ADMIN:-admin}
            - SWARMBOT_BOOTSTRAP_PASSWORD=${SWARMBOT_BOOTSTRAP_PASSWORD:?SWARMBOT_BOOTSTRAP_PASSWORD must be set for production deploys}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        ports:
            - 888:8080
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
            interval: 60s
            timeout: 10s
            retries: 3
        networks:
            - net

    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set for production deploys}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production deploys}
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set for production deploys}
        volumes:
            - db-data:/var/lib/postgresql/data
        networks:
            - net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 5s

    influxdb:
        image: influxdb:2.7
        environment:
            DOCKER_INFLUXDB_INIT_MODE: setup
            DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:?INFLUXDB_USER must be set for production deploys}
            DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD must be set for production deploys}
            DOCKER_INFLUXDB_INIT_ORG: swarmbot
            DOCKER_INFLUXDB_INIT_BUCKET: swarmbot
            DOCKER_INFLUXDB_INIT_RETENTION: 0
            DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN must be set for production deploys}
        volumes:
            - influx-data:/var/lib/influxdb2
        networks:
            - net

    agent:
        build:
            context: ./swarmagent
            dockerfile: Dockerfile
        image: swarmagent:latest
        environment:
            - DOCKER_API_VERSION=1.44
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - net

networks:
    net:
        driver: bridge

volumes:
    db-data:
        driver: local
    influx-data:
        driver: local
