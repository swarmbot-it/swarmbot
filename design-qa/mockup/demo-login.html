<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>demo.swarmbot.it — Zaloguj się</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#060a14; font-family:'Plus Jakarta Sans',sans-serif; color:#f1f5f9; }
  a { color:#FB923C; text-decoration:none; } a:hover { color:#F97316; }
  .glow { position:fixed; width:700px; height:700px; border-radius:50%; background:radial-gradient(circle, rgba(249,115,22,.06) 0%, transparent 65%); pointer-events:none; }
  .card { position:relative; width:400px; padding:34px 36px 26px; background:rgba(255,255,255,.02); border:1px solid rgba(249,115,22,.14); border-radius:20px; backdrop-filter:blur(20px); box-shadow:0 0 60px rgba(249,115,22,.04); display:flex; flex-direction:column; gap:18px; }
  .domain { align-self:flex-start; display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:999px; border:1px solid rgba(249,115,22,.2); background:rgba(249,115,22,.06); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; color:#F97316; }
  label { display:block; font-size:12px; font-weight:600; color:#94a3b8; margin:0 0 6px; }
  input { width:100%; padding:11px 13px; border-radius:10px; border:1px solid #232d49; background:rgba(255,255,255,.03); color:#cbd5e1; font-family:'JetBrains Mono',monospace; font-size:13px; }
  input:focus { outline:none; border-color:rgba(249,115,22,.5); }
  .btn { width:100%; padding:13px; border:none; border-radius:12px; background:linear-gradient(135deg,#F97316,#EA580C); color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; transition:transform .2s, box-shadow .2s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 10px 28px rgba(249,115,22,.35); }
  .note { display:flex; gap:9px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:rgba(16,185,129,.07); border:1px solid rgba(16,185,129,.2); font-size:12px; color:#94a3b8; line-height:1.5; }
</style>
</head>
<body>
  <div class="glow" style="top:-250px; left:-200px;"></div>
  <div class="glow" style="bottom:-250px; right:-200px;"></div>
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <div style="display:flex; align-items:center; gap:11px;">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <line x1="12" y1="16" x2="15.7" y2="9.4" stroke="#FB923C" stroke-width="1.2" stroke-linecap="round" opacity=".7"></line>
          <line x1="12" y1="16" x2="15.7" y2="22.6" stroke="#FB923C" stroke-width="1.2" stroke-linecap="round" opacity=".7"></line>
          <line x1="20.3" y1="9.4" x2="23" y2="14" stroke="#FB923C" stroke-width="1.2" stroke-linecap="round" opacity=".7"></line>
          <line x1="20.3" y1="22.6" x2="23" y2="18" stroke="#FB923C" stroke-width="1.2" stroke-linecap="round" opacity=".7"></line>
          <circle cx="9" cy="16" r="3.4" fill="#FB923C"></circle>
          <circle cx="18" cy="9" r="2.4" fill="#FDBA74"></circle>
          <circle cx="18" cy="23" r="2.4" fill="#FDBA74"></circle>
          <circle cx="25" cy="16" r="2.8" fill="#F97316"></circle>
        </svg>
        <span style="font-weight:800; font-size:17px; letter-spacing:-.02em;">swarmbot<span style="color:#FB923C;">.it</span></span>
      </div>
      <span class="domain">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        demo.swarmbot.it
      </span>
    </div>
    <div>
      <h1 style="margin:0 0 6px; font-size:22px; font-weight:800; letter-spacing:-.02em;">Zaloguj się do panelu</h1>
      <p style="margin:0; font-size:13px; color:#94a3b8; line-height:1.55;">Publiczne demo — dane logowania są już uzupełnione.</p>
    </div>
    <form style="display:flex; flex-direction:column; gap:14px; margin:0;" onsubmit="location.href='SwarmBot Admin.html?demo=1'; return false;">
      <div>
        <label for="email">E-mail</label>
        <input id="email" type="email" value="demo@swarmbot.it" readonly/>
      </div>
      <div>
        <label for="pass">Hasło</label>
        <input id="pass" type="password" value="swarm-demo-2026" readonly/>
      </div>
      <div class="note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none; margin-top:1px;"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span>Tryb tylko do odczytu — możesz przeglądać cały panel, ale wprowadzanie zmian jest wyłączone.</span>
      </div>
      <button class="btn" type="submit">Zaloguj</button>
    </form>
    <div style="text-align:center; font-size:12px;">
      <a href="SwarmBot Landing.dc.html">← swarmbot.it — strona główna</a>
    </div>
  </div>
</body>
</html>
